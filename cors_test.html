<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background-color: #f8f9fa; padding: 10px; border: 1px solid #e9ecef; }
    </style>
</head>
<body>
    <h1>Laravel API CORS Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Health Check Endpoint</h2>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <div id="health-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: CORS Test Endpoint</h2>
        <button onclick="testCors()">Test CORS Endpoint</button>
        <div id="cors-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Preflight Request</h2>
        <button onclick="testPreflight()">Test Preflight (POST)</button>
        <div id="preflight-result"></div>
    </div>

    <div class="test-section">
        <h2>Configuration</h2>
        <p><strong>API Base URL:</strong> <span id="api-url">http://127.0.0.1:8000/api</span></p>
        <p><strong>Current Origin:</strong> <span id="current-origin"></span></p>
        <p><strong>User Agent:</strong> <span id="user-agent"></span></p>
    </div>

    <script>
        // Configuration
        const API_BASE = 'http://127.0.0.1:8000/api';
        
        // Display current origin and user agent
        document.getElementById('current-origin').textContent = window.location.origin;
        document.getElementById('user-agent').textContent = navigator.userAgent;

        function displayResult(elementId, success, message, details = null) {
            const element = document.getElementById(elementId);
            element.className = success ? 'success' : 'error';
            let html = `<h3>${success ? '✅ Success' : '❌ Failed'}</h3><p>${message}</p>`;
            if (details) {
                html += `<pre>${JSON.stringify(details, null, 2)}</pre>`;
            }
            element.innerHTML = html;
        }

        async function testHealth() {
            try {
                console.log('Testing health endpoint...');
                const response = await fetch(`${API_BASE}/health`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    displayResult('health-result', true, 'Health endpoint responded successfully', {
                        status: response.status,
                        headers: Object.fromEntries(response.headers.entries()),
                        data: data
                    });
                } else {
                    displayResult('health-result', false, `Health endpoint failed with status ${response.status}`, {
                        status: response.status,
                        statusText: response.statusText
                    });
                }
            } catch (error) {
                displayResult('health-result', false, `Network error: ${error.message}`, {
                    error: error.toString(),
                    stack: error.stack
                });
            }
        }

        async function testCors() {
            try {
                console.log('Testing CORS endpoint...');
                const response = await fetch(`${API_BASE}/cors-test`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    displayResult('cors-result', true, 'CORS test endpoint responded successfully', {
                        status: response.status,
                        headers: Object.fromEntries(response.headers.entries()),
                        data: data
                    });
                } else {
                    displayResult('cors-result', false, `CORS test endpoint failed with status ${response.status}`, {
                        status: response.status,
                        statusText: response.statusText
                    });
                }
            } catch (error) {
                displayResult('cors-result', false, `CORS error: ${error.message}`, {
                    error: error.toString(),
                    stack: error.stack
                });
            }
        }

        async function testPreflight() {
            try {
                console.log('Testing preflight request...');
                const response = await fetch(`${API_BASE}/cors-test`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer test-token',
                    },
                    body: JSON.stringify({test: 'data'})
                });

                if (response.ok) {
                    const data = await response.json();
                    displayResult('preflight-result', true, 'Preflight request successful', {
                        status: response.status,
                        headers: Object.fromEntries(response.headers.entries()),
                        data: data
                    });
                } else {
                    displayResult('preflight-result', false, `Preflight request failed with status ${response.status}`, {
                        status: response.status,
                        statusText: response.statusText
                    });
                }
            } catch (error) {
                displayResult('preflight-result', false, `Preflight error: ${error.message}`, {
                    error: error.toString(),
                    stack: error.stack
                });
            }
        }

        // Auto-run basic test on page load
        window.onload = function() {
            setTimeout(testHealth, 1000);
        };
    </script>
</body>
</html>
